name: "Stage 1 — PR Gate"

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Secrets injection via Bitwarden ──────────────────────────────────────
  secrets:
    name: Load secrets (Bitwarden SM)
    runs-on: ubuntu-latest
    outputs:
      database_url: ${{ steps.bws.outputs.database_url }}
    steps:
      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bws
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ secrets.BWS_DATABASE_URL_ID }} > DATABASE_URL

  # ── Lint & Format ──────────────────────────────────────────────────────
  lint:
    name: Lint + Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check

  # ── TypeScript ────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript strict check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── Unit Tests + Coverage ─────────────────────────────────────────────
  test:
    name: Unit tests (min 80% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage OK: $COVERAGE%"
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Dependency vulnerabilities ────────────────────────────────────────
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── License compliance ────────────────────────────────────────────────
  license-check:
    name: License compliance (no GPL in production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx license-checker --excludePrivatePackages --failOn "GPL;LGPL;AGPL"

  # ── WCAG AA accessibility ─────────────────────────────────────────────
  wcag:
    name: WCAG 2.1 AA (axe-core + Pa11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@lms/web
      - name: Run Pa11y CI
        run: npx pa11y-ci --config .pa11yci.json
      - name: Run axe-core via Playwright
        run: pnpm test:wcag

  # ── Loi 25 compliance gate ────────────────────────────────────────────
  loi25-gate:
    name: Loi 25 / Privacy compliance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Loi 25 compliance checks
        run: pnpm --filter=@lms/compliance run check:loi25
      - name: Verify data residency (ca-central-1 only)
        run: |
          if grep -r "us-east\|eu-west\|ap-southeast" --include="*.ts" --include="*.json" .; then
            echo "❌ Non-Canadian region detected — Loi 25 violation"
            exit 1
          fi
          echo "✅ Data residency check passed"

  # ── Final gate: all must pass ─────────────────────────────────────────
  pr-gate-passed:
    name: ✅ PR Gate passed
    needs: [lint, typecheck, test, dependency-scan, license-check, wcag, loi25-gate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Stage 1 checks passed — ready for review"
