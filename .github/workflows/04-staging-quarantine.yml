name: "Stage 4 — Staging Quarantine"

on:
  push:
    branches:
      - staging

env:
  QUARANTINE_HOURS: 72  # Minimum 72h before Stage 5 is allowed

jobs:
  deploy-staging:
    name: Deploy to staging (AWS ca-central-1)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ secrets.BWS_STAGING_DB_ID }} > DATABASE_URL
            ${{ secrets.BWS_STAGING_KEYCLOAK_SECRET_ID }} > KEYCLOAK_CLIENT_SECRET

      - name: Deploy to staging
        run: |
          echo "Deploying to staging — AWS ca-central-1"
          # Add your deploy command here (ECS, EKS, etc.)

      - name: Record quarantine start time
        run: |
          echo "QUARANTINE_START=$(date -u +%s)" >> $GITHUB_ENV
          echo "Quarantine started at $(date -u). Minimum ${QUARANTINE_HOURS}h required."

  smoke-tests:
    name: Post-deploy smoke tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run smoke tests against staging
        run: pnpm test:smoke
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          API_URL: ${{ secrets.STAGING_API_URL }}

  load-tests:
    name: Load tests (k6) — p95 < 500ms, 0 errors at 1000 users
    needs: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6-scenarios.js
          flags: --out json=k6-results.json
        env:
          K6_BASE_URL: ${{ secrets.STAGING_API_URL }}

      - name: Validate load test thresholds
        run: |
          P95=$(cat k6-results.json | jq '[.[] | select(.type=="Point" and .metric=="http_req_duration") | .data.value] | percentile(95)')
          ERRORS=$(cat k6-results.json | jq '[.[] | select(.type=="Point" and .metric=="http_req_failed") | .data.value] | add')
          echo "p95 latency: ${P95}ms | Errors: $ERRORS"
          if (( $(echo "$P95 > 500" | bc -l) )); then
            echo "❌ p95 ${P95}ms exceeds 500ms threshold"
            exit 1
          fi
          if (( $(echo "$ERRORS > 0" | bc -l) )); then
            echo "❌ $ERRORS errors detected under load"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ github.sha }}
          path: k6-results.json
          retention-days: 90

  accessibility-full-audit:
    name: Full accessibility audit (WCAG 2.1 AA — multi-page)
    needs: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Full WCAG audit on staging
        run: pnpm test:wcag:staging
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: wcag-report-${{ github.sha }}
          path: wcag-report/
          retention-days: 90

  quarantine-notice:
    name: Quarantine period notice
    needs: [smoke-tests, load-tests, accessibility-full-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Post quarantine notice
        run: |
          echo "## ⏳ Staging Quarantine Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All automated tests passed. Mandatory quarantine period: **${{ env.QUARANTINE_HOURS }} hours**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required before Stage 5:**" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Manual QA sign-off" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Privacy officer (RPP) sign-off — Loi 25" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Security officer sign-off" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Earliest promotion to pre-production: **$(date -d '+${{ env.QUARANTINE_HOURS }} hours' -u)**" >> $GITHUB_STEP_SUMMARY
